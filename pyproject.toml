[project]
name = "content-builder-agent"
version = "0.1.0"
description = "A content writer agent configured entirely through files on disk"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.12",
    "google-genai>=2.10.0",
    "langchain>=1.3.11",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.3.3",
    "langchain-openrouter>=0.2.6",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "redis>=8.0.1",
    "rich>=15.0.0",
    "streamlit>=1.35.0",
    "tavily-python>=0.7.26",
]

[dependency-groups]
dev = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
